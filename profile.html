<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Profile</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; line-height: 1.5; max-width: 760px; margin: 0 auto; padding: 40px 20px; background: #fdfdfd; color: #222; }
    nav { text-align: center; margin-bottom: 34px; } nav a { color: #0366d6; text-decoration: none; font-weight: 500; }
    .card { background: #fff; border: 1px solid #e5e5e5; border-radius: 12px; padding: 28px; box-shadow: 0 2px 5px rgba(0,0,0,.03); }
    h1 { margin: 0 0 6px; font-size: 2em; } .intro { color: #57606a; margin-top: 0; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    label { display: block; margin: 16px 0 6px; font-weight: 600; font-size: .94em; }
    input { width: 100%; padding: 10px 12px; border: 1px solid #d0d7de; border-radius: 7px; font: inherit; }
    input:focus { outline: 2px solid #b6d7ff; border-color: #0969da; }
    .actions { display: flex; gap: 12px; margin-top: 26px; } button { border: 0; border-radius: 7px; padding: 10px 16px; cursor: pointer; font: inherit; font-weight: 600; }
    .primary { background: #0969da; color: #fff; } .secondary { background: #f3f4f6; color: #24292f; }
    #status { min-height: 1.5em; margin: 15px 0 0; color: #1a7f37; font-weight: 500; }
    @media (max-width: 560px) { .grid { grid-template-columns: 1fr; } .card { padding: 22px; } }
  </style>
</head>
<body>
  <nav><a href="index.html">← Back to profile</a></nav>
  <main class="card">
    <h1>Manage profile</h1>
    <p class="intro">Update the details shown on your home page. Changes are saved in this browser.</p>
    <form id="profile-form">
      <div class="grid"><div><label for="name">Display name</label><input id="name" required /></div><div><label for="email">Email address</label><input id="email" type="email" required /></div></div>
      <label for="affiliation">Affiliation</label><input id="affiliation" required />
      <label for="photo">Profile photo URL or path</label><input id="photo" placeholder="images/Me.jpg" />
      <div class="grid"><div><label for="twitter">X / Twitter URL</label><input id="twitter" type="url" /></div><div><label for="scholar">Google Scholar URL</label><input id="scholar" type="url" /></div><div><label for="linkedin">LinkedIn URL</label><input id="linkedin" type="url" /></div><div><label for="wechat">WeChat ID</label><input id="wechat" /></div></div>
      <div class="actions"><button class="primary" type="submit">Save changes</button><button class="secondary" type="button" id="reset">Restore defaults</button></div>
      <p id="status" role="status"></p>
    </form>
  </main>
  <script>
    const defaults = { name: 'Minghao (Mark) Liu', affiliation: 'The Hong Kong University of Science and Technology, Hong Kong SAR, China', email: 'mliuby@connect.ust.hk', photo: 'images/Me.jpg', twitter: 'https://x.com/liu34836428', scholar: 'https://scholar.google.com/citations?user=o37OuuAAAAAJ&hl=en', linkedin: 'https://www.linkedin.com/in/minghao-liu-2a70a9280/', wechat: 'binghailong2004' };
    const fields = Object.keys(defaults), form = document.getElementById('profile-form');
    function populate(profile) { fields.forEach(field => document.getElementById(field).value = profile[field] || ''); }
    populate({ ...defaults, ...JSON.parse(localStorage.getItem('personalProfile') || '{}') });
    form.addEventListener('submit', event => { event.preventDefault(); const profile = Object.fromEntries(fields.map(field => [field, document.getElementById(field).value.trim()])); localStorage.setItem('personalProfile', JSON.stringify(profile)); document.getElementById('status').textContent = 'Profile saved. Open the home page to see your updates.'; });
    document.getElementById('reset').addEventListener('click', () => { localStorage.removeItem('personalProfile'); populate(defaults); document.getElementById('status').textContent = 'Default profile restored.'; });
  </script>
</body>
</html>
